{{ define "main" }}
<div class="mx-auto max-w-4xl px-5 py-10">
  <header>
    <a href="{{ .Site.Home.RelPermalink }}" class="text-sm text-accent hover:underline">← {{ i18n "back_home" }}</a>
    <h1 class="mt-3 text-3xl font-semibold tracking-tight text-heading">{{ i18n "authors" }}</h1>
  </header>
  <div class="mt-8 grid gap-4 sm:grid-cols-2">
    {{ range .Pages }}
    <a href="{{ .RelPermalink }}" class="card-shadow flex items-center gap-4 p-5">
      <span class="text-3xl">👨‍🍳</span>
      <div>
        <h2 class="text-lg font-semibold text-heading">{{ .Title }}</h2>
        <p class="text-sm text-muted">{{ len .Pages }} {{ i18n "recipes_count" }}</p>
      </div>
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
