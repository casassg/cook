<footer class="sticky bottom-0 z-30 mt-10 bg-surface px-5 py-6 text-sm text-muted shadow-[0_-4px_6px_rgba(0,0,0,0.07)]">
    <div class="flex items-center justify-between">
        <p>{{ i18n "footer_made" }} {{ .Site.Params.author }}</p>
        <div class="flex items-center gap-3">
            {{- partial "language-switcher.html" . }}
            <button type="button" x-data="themeToggle" @click="toggle()" aria-label="Toggle dark mode" class="rounded-full p-1.5 transition hover:text-accent">
                <span class="dark:hidden">🌙</span>
                <span class="hidden dark:inline">☀️</span>
            </button>
        </div>
    </div>
</footer>
