{{ range . }}<span class="relative inline-block" x-data="{show:false}" @click.outside="show=false" @keydown.escape="show=false"><span role="button" tabindex="0" aria-label="{{ .label }}" class="cursor-pointer" @click.stop="show=!show">🛒</span><span x-show="show" x-transition x-cloak class="absolute left-1/2 bottom-full mb-2 z-40 w-max max-w-[14rem] -translate-x-1/2 rounded-lg border border-line bg-bg px-3 py-2 text-sm shadow-lg"><a href="{{ .url }}" target="_blank" rel="noopener" class="font-medium text-accent underline underline-offset-2 hover:text-accent-hover" @click.stop>{{ .label }} ↗</a><span class="absolute left-1/2 top-full -translate-x-1/2 -translate-y-1/2 rotate-45 h-2 w-2 border-b border-r border-line bg-bg"></span></span></span>{{ end }}
