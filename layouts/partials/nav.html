<header class="border-b border-line">
    <div class="mx-auto flex max-w-3xl items-center justify-between px-5 py-4">
        <a href="{{ .Site.Home.RelPermalink }}" class="text-lg font-semibold tracking-tight text-heading">
            🥣 {{ .Site.Title }}
        </a>
        <div class="flex items-center gap-4 text-sm">
            {{- partial "language-switcher.html" . }}
            <button type="button" x-data="themeToggle" @click="toggle()" aria-label="Toggle dark mode" class="rounded-full p-1.5 text-muted transition hover:text-accent">
                <span class="dark:hidden">🌙</span>
                <span class="hidden dark:inline">☀️</span>
            </button>
        </div>
    </div>
</header>
